name: Multi-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. WINDOWS BUILD & INNO SETUP INSTALLER
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Inno Setup
        uses: sbsoftware/action-setup-inno-setup@v1

      - name: Build & Publish WPF App
        run: |
          dotnet publish AntiFlickerDimmer.csproj -c Release -r win-x64 --self-contained false -o bin/Release/net9.0-windows/publish /p:DebugType=none /p:DebugSymbols=false /p:PathMap="${{ github.workspace }}=/_"

      - name: Compile Inno Setup Installer
        run: |
          iscc installer.iss

      - name: Zip Standalone Release
        shell: pwsh
        run: |
          Compress-Archive -Path bin/Release/net9.0-windows/publish/* -DestinationPath FlickerFreeDimmer-Windows-Portable.zip

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickerFreeDimmer-Windows-Setup
          path: bin/Release/net9.0-windows/installer/FlickerFreeDimmer_Setup_v1.0.0.exe

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickerFreeDimmer-Windows-Portable
          path: FlickerFreeDimmer-Windows-Portable.zip

  # -------------------------------------------------------------
  # 2. MACOS BUILD & APP BUNDLE
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS Universal App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          cd macos
          chmod +x build-app.sh
          ./build-app.sh
          zip -r ../FlickerFreeDimmer-macOS-Universal.zip FlickerFreeDimmer.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickerFreeDimmer-macOS-Universal
          path: FlickerFreeDimmer-macOS-Universal.zip

  # -------------------------------------------------------------
  # 3. LINUX PACKAGING & VERIFICATION
  # -------------------------------------------------------------
  build-linux:
    name: Package Linux Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Python Script
        run: |
          python3 -m py_compile linux/flickerfree-dimmer

      - name: Package Linux Archive
        run: |
          chmod +x linux/flickerfree-dimmer linux/install.sh
          tar -czvf FlickerFreeDimmer-Linux-x64.tar.gz linux/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickerFreeDimmer-Linux-x64
          path: FlickerFreeDimmer-Linux-x64.tar.gz

  # -------------------------------------------------------------
  # 4. GITHUB RELEASE CREATION (ON TAGS)
  # -------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: FlickerFreeDimmer-Windows-Setup

      - name: Download Windows Portable
        uses: actions/download-artifact@v4
        with:
          name: FlickerFreeDimmer-Windows-Portable

      - name: Download macOS App
        uses: actions/download-artifact@v4
        with:
          name: FlickerFreeDimmer-macOS-Universal

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: FlickerFreeDimmer-Linux-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlickerFreeDimmer_Setup_v1.0.0.exe
            FlickerFreeDimmer-Windows-Portable.zip
            FlickerFreeDimmer-macOS-Universal.zip
            FlickerFreeDimmer-Linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
